title: pullit

url: https://dev.bautheac.net/pullit


reference:
  - title: Pull
    desc: >
        Retrieve data from Bloomberg or from a storethat database:
    contents:
      - starts_with("pull_")
  - title: Bloomberg
    desc: >
        Retrieve data from Bloomberg:
    contents:
      - starts_with("BBG_")
  - title: storethat
    desc: >
        Retrieve data from a storethat database:
    contents:
      - starts_with("storethat_")
  - title: Update
    desc: >
        Update the data of a storethat database:
    contents:
      - starts_with("update_")
  - title: Classes
    desc: >
        Objects returned by the pull functions:
    contents:
      - ends_with("-class")
  - title: accessors
    desc: >
      Access returned data:
    contents:
      - get_tickers
      - get_active_contract_tickers
      - get_term_structure_tickers
      - get_CFTC_tickers
      - get_fields
      - get_data
      - get_info
      - get_call
      - get_periods
      - "`show,DataInfo-method`"
  - title: Helpers
    contents:
      - all_fields_exist
      - all_tickers_exist
      - create_futures_spot
      - futures_ticker
      - random_index_market

articles:
  - title: pullit!
    desc: >
        Get started:
    contents:
      - pullit

navbar:
  title: ~
  type: default
  left:
    - text: home
      href: index.html
    - text: functions
      href: reference/index.html
    - text: get started
      href: articles/pullit.html


